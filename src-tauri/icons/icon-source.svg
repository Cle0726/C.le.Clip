<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f82aa"/>
      <stop offset="0.42" stop-color="#334b68"/>
      <stop offset="1" stop-color="#18283d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9ddff" stop-opacity="0.98"/>
      <stop offset="0.52" stop-color="#6fa4d7" stop-opacity="0.66"/>
      <stop offset="1" stop-color="#d7e8f7" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#88b7e7" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#667e9f" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#416993" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a8c4df" stop-opacity="0.34"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26" result="blur"/>
      <feOffset dy="24" result="off"/>
      <feColorMatrix in="off" type="matrix" values="0 0 0 0 0.02 0 0 0 0 0.06 0 0 0 0 0.12 0 0 0 0.58 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="94" y="94" width="836" height="836" rx="198"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="94" y="94" width="836" height="836" rx="198" fill="url(#glass)" stroke="url(#edge)" stroke-width="18"/>
    <rect x="112" y="112" width="800" height="800" rx="180" fill="none" stroke="#f3f8ff" stroke-opacity="0.22" stroke-width="5"/>
    <path d="M150 165 C360 92 700 106 868 166" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="18" stroke-linecap="round"/>

    <g clip-path="url(#clip)">
      <path d="M72 774 C215 666 338 850 476 872 C626 896 702 766 960 794 L960 968 L66 968 Z" fill="url(#wave1)"/>
      <path d="M50 864 C232 790 350 920 520 884 C690 848 734 768 980 836 L980 968 L44 968 Z" fill="url(#wave2)"/>
      <path d="M120 710 C250 652 354 774 482 824 C616 876 760 762 920 742" fill="none" stroke="#c8def3" stroke-opacity="0.16" stroke-width="8"/>
      <ellipse cx="806" cy="214" rx="176" ry="110" fill="#ffffff" opacity="0.08"/>
    </g>
  </g>

  <path d="M666 337 A258 258 0 1 0 666 687" fill="none" stroke="#f8fafc" stroke-width="118" stroke-linecap="butt" filter="url(#softGlow)"/>
  <circle cx="742" cy="704" r="58" fill="#f8fafc" filter="url(#softGlow)"/>
</svg>
