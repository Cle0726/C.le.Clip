name: Release Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            target: ''
            artifact_name: C.le.Clip-Windows-x64
            artifact_path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macOS Apple Silicon
            platform: macos-14
            target: aarch64-apple-darwin
            artifact_name: C.le.Clip-macOS-Apple-Silicon
            artifact_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: C.le.Clip-macOS-Intel
            artifact_path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        if: matrix.target == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust target
        if: matrix.target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build desktop package
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run tauri:build -- --target "${{ matrix.target }}"
          else
            npm run tauri:build
          fi

      - name: Upload packaged installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release assets
        shell: bash
        run: |
          find release-assets -maxdepth 2 -type f -print
          test -n "$(find release-assets -type f -name '*.exe' -print -quit)" || { echo 'Missing Windows .exe'; exit 1; }
          test -n "$(find release-assets -type f -name '*.msi' -print -quit)" || { echo 'Missing Windows .msi'; exit 1; }
          DMG_COUNT=$(find release-assets -type f -name '*.dmg' | wc -l | tr -d ' ')
          test "$DMG_COUNT" -ge 2 || { echo 'Missing one or more macOS .dmg files'; exit 1; }

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          C.le. Clip v${{ steps.version.outputs.version }}

          Cross-platform clipboard manager with C.le. Actions and Prompt optimization.

          This release includes the blue-gray glass C.le. Clip application icon and architecture-matched macOS builds.

          Downloads:
          - Windows x64: `.exe` and `.msi`
          - macOS Apple Silicon: `.dmg`
          - macOS Intel: `.dmg`

          Note: this release is not code-signed/notarized yet, so Windows SmartScreen or macOS Gatekeeper may show a warning.
          EOF

      - name: Create or repair public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" \
              --title "C.le. Clip v$RELEASE_VERSION" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "C.le. Clip v$RELEASE_VERSION" \
              --notes-file release-notes.md \
              --latest
          fi
