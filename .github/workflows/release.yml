name: Release Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'app-v*'

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/app-v') || contains(github.event.head_commit.message, '[release]')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Generate full app icon set
        run: npm run icons

      - name: Build and publish
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'C.le. Clip v__VERSION__'
          releaseBody: |
            C.le. Clip v__VERSION__

            Cross-platform clipboard manager with C.le. Actions and Prompt optimization.

            This release includes the new blue-gray glass C.le. Clip application icon across Windows and macOS.

            Downloads:
            - Windows: installer packages generated by Tauri
            - macOS Apple Silicon: aarch64 build
            - macOS Intel: x86_64 build

            Note: this release is not code-signed/notarized yet, so Windows SmartScreen or macOS Gatekeeper may show a warning.
          releaseDraft: false
          prerelease: false
          uploadWorkflowArtifacts: true
          args: ${{ matrix.args }}
